# Tiny Tapeout project information for the phase-P0 observable circuit.
project:
  title: "Hardcaml protocol emulator"
  author: "Bohdan Purtell"
  discord: ""
  description: "Programmable protocol emulator primitives generated by Hardcaml"
  language: "Verilog"
  clock_hz: 48000000
  tiles: "6x4"
  top_module: "tt_um_leemperor_hardcaml_protemu"
  source_files:
    - "p0_observable.v"
    - "project.v"

pinout:
  ui[0]: "P0 delay bit 0"
  ui[1]: "P0 delay bit 1"
  ui[2]: "P0 delay bit 2"
  ui[3]: "P0 delay bit 3"
  ui[4]: "P0 protocol pin 0 value"
  ui[5]: "P0 protocol pin 0 output enable"
  ui[6]: "P0 command valid"
  ui[7]: "Reserved"
  uo[0]: "Timer bit 0"
  uo[1]: "Timer bit 1"
  uo[2]: "Timer bit 2"
  uo[3]: "Timer bit 3"
  uo[4]: "Command ready"
  uo[5]: "Timer busy"
  uo[6]: "Command done pulse"
  uo[7]: "Command rejected pulse"
  uio[0]: "Protocol pin 0"
  uio[1]: "Protocol pin 1"
  uio[2]: "Protocol pin 2"
  uio[3]: "Protocol pin 3"
  uio[4]: "Protocol pin 4"
  uio[5]: "Protocol pin 5"
  uio[6]: "Protocol pin 6"
  uio[7]: "Protocol pin 7"

yaml_version: 6
